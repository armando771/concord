# appId continua o do Concord (nome antigo): é ele que faz a versão nova
# substituir a instalação antiga em vez de instalar um segundo app.
appId: com.concord.app
productName: Salinha
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  # Build web (yarn build:web) e a config dele: não vão no instalador.
  - '!{vite.web.config.ts,vite.renderer.shared.ts}'
  - '!{dist-web,web-public}/**'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!resources/win/**'
  - '!**/*.test.ts'
asarUnpack:
  - resources/**
win:
  executableName: Salinha
  # Helper do som da janela compartilhada (gerado por scripts/build-win.sh)
  extraResources:
    - from: resources/win/concord-audio.exe
      to: concord-audio.exe
  target:
    - portable
    - nsis
portable:
  artifactName: Salinha-${version}-portable.${ext}
nsis:
  artifactName: Salinha-${version}-setup.${ext}
  # Registra o protocolo salinha:// (links de convite) na instalação. O
  # "protocols" abaixo não vale para o NSIS no electron-builder 26.
  include: build/installer.nsh
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
# Links de convite (salinha://convite/<código>): macOS (Info.plist) e Linux
# (.desktop). No Windows quem registra é o build/installer.nsh e o próprio app
# (app.setAsDefaultProtocolClient).
protocols:
  - name: Salinha
    schemes:
      - salinha
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  icon: resources/icon.png
  target:
    - AppImage
  category: Network
appImage:
  # Distribuímos apenas x64; o macro arch do AppImage expande para x86_64.
  artifactName: Salinha-${version}-x64.${ext}
npmRebuild: false
# Atualização automática: latest.yml + instalador servidos pelo próprio
# servidor da Salinha (<servidor>/updates/). A URL vem dos scripts de build.
publish:
  provider: generic
  url: ${env.CONCORD_UPDATE_URL}
