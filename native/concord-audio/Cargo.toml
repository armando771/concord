[package]
name = "concord-audio"
version = "0.1.0"
edition = "2021"
description = "Captura o áudio de um processo (WASAPI process loopback) para o compartilhamento de tela do Concord"
publish = false

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
