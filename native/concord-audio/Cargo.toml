[package]
name = "concord-audio"
version = "0.1.0"
edition = "2021"
description = "Captura o áudio de um processo (WASAPI process loopback) para o compartilhamento de tela do Concord"
publish = false

[target.'cfg(windows)'.dependencies]
# wasapi: captura por processo (application loopback) já pronta e testada.
wasapi = "0.26"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
