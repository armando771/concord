[package]
name = "concord-audio"
version = "0.1.0"
edition = "2021"
description = "Helper nativo da Salinha no Windows: áudio por processo (compartilhamento de tela) e janela em tela cheia (overlay de jogo)"
publish = false

[target.'cfg(windows)'.dependencies]
# wasapi: captura por processo (application loopback) já pronta e testada.
wasapi = "0.26"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Shell"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
