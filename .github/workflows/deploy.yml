# Deploy automático: a cada push/merge na main, testa tudo e, se passar,
# publica na VPS o backend, a página de download (site/), o app web
# (frontend/dist-web) e uma versão nova do app desktop (os apps abertos
# mostram "Nova atualização disponível").
#
# Configuração do repositório (Settings → Secrets and variables → Actions):
#   Secrets:
#     VPS_SSH_KEY      chave SSH privada de deploy (acesso à VPS)
#     VPS_KNOWN_HOSTS  linha(s) de known_hosts da VPS (ssh-keyscan)
#     RELEASE_KEY      chave Ed25519 que assina as atualizações (backend/.release-key)
#   Variables:
#     DEPLOY_ENABLED   "true" para ligar o deploy (sem isso, só roda os testes)
#     VPS_HOST         ex.: root@1.2.3.4
#     PUBLIC_URL       ex.: https://1-2-3-4.sslip.io
#     SITE_URL         (opcional) página de download a conferir (padrão: https://salinha.bhrx.com.br)
#     WEB_URL          (opcional) app web a conferir, ex.: https://app-salinha.bhrx.com.br
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Um deploy por vez, na ordem dos commits.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Backend
        working-directory: backend
        run: go test ./...

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: App desktop
        working-directory: frontend
        run: |
          npm i -g yarn@1.22.22
          yarn install --frozen-lockfile --ignore-scripts
          yarn typecheck
          yarn test
      - name: App web (build)
        working-directory: frontend
        run: yarn build:web
      - name: Scripts
        run: node --test scripts/*.test.mjs

      - name: Helper de áudio (Rust)
        working-directory: native/concord-audio
        run: cargo test

  deploy:
    needs: test
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      VPS_HOST: ${{ vars.VPS_HOST }}
      SITE_URL: ${{ vars.SITE_URL || 'https://salinha.bhrx.com.br' }}
      WEB_URL: ${{ vars.WEB_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Acesso à VPS e chave de assinatura
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$VPS_SSH_KEY" | scripts/write-key.sh ~/.ssh/id_ed25519 "OPENSSH PRIVATE KEY"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if ! pub=$(ssh-keygen -y -f ~/.ssh/id_ed25519 2>/dev/null); then
            echo "::error::secret VPS_SSH_KEY inválido — cole o arquivo inteiro da chave privada (com as linhas BEGIN/END)"
            exit 1
          fi
          echo "chave SSH de deploy (precisa estar no authorized_keys da VPS): $pub"

          printf '%s' "$RELEASE_KEY" | scripts/write-key.sh backend/.release-key "PRIVATE KEY"
          if ! openssl pkey -in backend/.release-key -noout 2>/dev/null; then
            echo "::error::secret RELEASE_KEY inválido — cole o conteúdo inteiro de backend/.release-key (com as linhas BEGIN/END)"
            exit 1
          fi
          echo "chave pública de assinatura:"
          openssl pkey -in backend/.release-key -pubout

      - name: Versão
        id: version
        run: |
          published=$(curl -fsS "${PUBLIC_URL%/}/updates/latest.yml" | awk '/^version:/ {print $2}' || true)
          local=$(node -p "require('./frontend/package.json').version")
          version=$(node scripts/next-version.mjs "${published:--}" "$local")
          echo "publicada: ${published:-nenhuma} → nova: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Antes do instalador: se o build web quebrar, nada é publicado.
      - name: App web
        working-directory: frontend
        run: |
          npm i -g yarn@1.22.22
          yarn install --frozen-lockfile --ignore-scripts
          yarn build:web

      - name: App desktop (instalador assinado)
        run: scripts/release-win.sh "${{ steps.version.outputs.version }}"

      - name: App desktop Linux (AppImage assinado)
        run: scripts/release-linux.sh "${{ steps.version.outputs.version }}"

      - name: Publicar na VPS (backend + página de download + app web + atualização do app)
        run: scripts/deploy-vps.sh "$VPS_HOST"

      - name: Conferir
        run: |
          curl -fsS "${PUBLIC_URL%/}/updates/latest.yml" | grep -q "version: ${{ steps.version.outputs.version }}"
          curl -fsS "${PUBLIC_URL%/}/updates/latest-linux.yml" | grep -q "version: ${{ steps.version.outputs.version }}"
          for manifest in latest.yml latest-linux.yml; do
            path=$(curl -fsS "${PUBLIC_URL%/}/updates/$manifest" | awk '/^path:/ {print $2}' | tr -d "\"'")
            test -n "$path"
            curl -fsSI "${PUBLIC_URL%/}/updates/$path"
            curl -fsS "${PUBLIC_URL%/}/updates/$path.sig" | grep -q .
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' "${PUBLIC_URL%/}/rtc/validate")" = 401
          curl -fsS "${PUBLIC_URL%/}/healthz" | grep -q '"ok"'
          if [[ -n "$SITE_URL" ]]; then
            curl -fsS "${SITE_URL%/}/" | grep -q 'data-download'
            curl -fsS "${SITE_URL%/}/updates/latest.yml" | grep -q "version: ${{ steps.version.outputs.version }}"
            curl -fsS "${SITE_URL%/}/updates/latest-linux.yml" | grep -q "version: ${{ steps.version.outputs.version }}"
            echo "Página de download no ar em ${SITE_URL%/}"
          fi
          if [[ -n "$WEB_URL" ]]; then
            curl -fsS "${WEB_URL%/}/" | grep -q '<div id="root">'
            # Rota funda: o Caddy devolve o index.html (fallback de SPA).
            curl -fsS "${WEB_URL%/}/friends" | grep -q '<div id="root">'
            test "$(curl -s -o /dev/null -w '%{http_code}' "${WEB_URL%/}/api/users/me")" = 401
            test "$(curl -s -o /dev/null -w '%{http_code}' "${WEB_URL%/}/rtc/validate")" = 401
            echo "App web no ar em ${WEB_URL%/}"
          fi
          echo "Salinha ${{ steps.version.outputs.version }} no ar em ${PUBLIC_URL%/}"

      - name: Limpar chaves
        if: always()
        run: rm -f ~/.ssh/id_ed25519 backend/.release-key
