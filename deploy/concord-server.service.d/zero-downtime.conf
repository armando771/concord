# Complemento do /etc/systemd/system/concord-server.service da VPS. Instale em
# /etc/systemd/system/concord-server.service.d/zero-downtime.conf e rode
# `systemctl daemon-reload` (não reinicia nada). Veja docs/HOSPEDAGEM.md.
[Unit]
# Postgres e LiveKit rodam no Docker: sobe depois dele num boot da VPS (o
# backend ainda espera o banco por até 30 s).
After=network-online.target docker.service
Wants=network-online.target docker.service
# Sem limite de reinícios: com RestartSec=1, cinco falhas seguidas em 10 s
# (ex.: banco ainda subindo) fariam o systemd desistir de vez
# (start-limit-hit) até alguém rodar reset-failed.
StartLimitIntervalSec=0
# Porta com o systemd (concord-server.socket): no reinício ela não fecha.
# Wants (e não Requires): sem o arquivo do socket o serviço ainda sobe,
# escutando sozinho. Para parar de vez: systemctl stop concord-server.socket
# concord-server (parar só o serviço não basta: a próxima conexão o sobe de
# novo). Não reinicie o socket sozinho com o serviço no ar (a porta ainda está
# com o processo e o socket não reabre): pare os dois e suba os dois.
Wants=concord-server.socket
After=concord-server.socket

[Service]
# SIGTERM: o backend para de aceitar conexões, fecha os WebSockets com 1012
# ("servidor reiniciando"), corta downloads longos e termina as requisições em
# andamento (até 3 s).
KillSignal=SIGTERM
# Folga sobre os ~3,5 s do backend: o systemd só mata à força depois disso.
TimeoutStopSec=10
# Se cair sozinho, volta em 1 s (o app espera até 15 s antes de tirar alguém
# da chamada).
RestartSec=1
