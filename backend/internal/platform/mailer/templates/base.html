<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>{{.Title}}</title>
</head>
<body style="margin:0;padding:0;background:#050508;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#050508;">{{.Preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#050508;padding:32px 12px;">
 <tr><td align="center">
  <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="width:100%;max-width:560px;background:#12121a;border:1px solid #232336;border-radius:16px;font-family:'Segoe UI',Helvetica,Arial,sans-serif;color:#e5e7eb;">
   <tr><td style="height:4px;background:#5865f2;background-image:linear-gradient(90deg,#5865f2,#8b5cf6);border-radius:16px 16px 0 0;font-size:0;line-height:0;">&nbsp;</td></tr>
   <tr><td style="padding:28px 40px 0;">
     <table role="presentation" cellpadding="0" cellspacing="0"><tr>
      <td style="padding-right:12px;"><img src="{{.IconSrc}}" width="40" height="40" alt="" style="display:block;border:0;border-radius:10px;"></td>
      <td style="font-size:22px;font-weight:700;letter-spacing:.3px;color:#ffffff;font-family:'Segoe UI',Helvetica,Arial,sans-serif;">Salinha</td>
     </tr></table>
   </td></tr>
   <tr><td style="padding:24px 40px 0;">
     <h1 style="margin:0;font-size:22px;line-height:1.3;color:#ffffff;">{{.Title}}</h1>
     <p style="margin:16px 0 0;font-size:15px;line-height:1.65;color:#b4b8c5;">Olá, <strong style="color:#ffffff;">{{.Name}}</strong>! {{.Intro}}</p>
   </td></tr>
   <tr><td align="center" style="padding:28px 40px 8px;">
     <a href="{{.URL}}" style="display:inline-block;background:#5865f2;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:14px 32px;border-radius:10px;">{{.Button}}</a>
   </td></tr>
   <tr><td style="padding:16px 40px 0;font-size:13px;line-height:1.6;color:#8b90a0;">{{.Expires}}</td></tr>
   <tr><td style="padding:24px 40px 0;"><div style="border-top:1px solid #232336;font-size:0;line-height:0;">&nbsp;</div></td></tr>
   <tr><td style="padding:16px 40px 0;font-size:12px;line-height:1.6;color:#6b7280;">Se o botão não funcionar, copie e cole este endereço no navegador:<br><a href="{{.URL}}" style="color:#8b9bff;word-break:break-all;">{{.URL}}</a></td></tr>
   <tr><td style="padding:16px 40px 32px;font-size:12px;line-height:1.6;color:#6b7280;">{{.Note}}</td></tr>
  </table>
  <p style="margin:16px 0 0;font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:11px;color:#4b5060;">Você recebeu este e-mail porque ele foi usado em uma conta do Salinha.</p>
 </td></tr>
</table>
</body>
</html>
